name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 6.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 6.0

      - name: Run Pester suite
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 6.0
          # Skip slop-opencode-check.ps1 (requires a user-specific global OpenCode config).
          $agg = 'tests/Slop.CI.Tests.ps1'
          @'
$ErrorActionPreference = 'Stop'
Import-Module Pester -MinimumVersion 6.0
Get-ChildItem -Path $PSScriptRoot -Filter '*-check.ps1' |
    Where-Object { $_.Name -ne 'slop-opencode-check.ps1' } |
    Sort-Object Name |
    ForEach-Object { . $_.FullName }
'@ | Set-Content -Path $agg
          Invoke-Pester -Path $agg -CI -Output Detailed
          Remove-Item $agg -Force
