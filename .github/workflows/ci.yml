name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 6.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 6.0

      - name: Run Pester suite
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 6.0
          $paths = Get-ChildItem -Path tests -Filter '*-check.ps1' |
            Where-Object { $_.Name -ne 'slop-opencode-check.ps1' } |
            Select-Object -ExpandProperty FullName
          Invoke-Pester -Path $paths -CI -Output Detailed
